[project]
name = "tierheim"
version = "0.1.0"
description = "Tierheim-Verwaltung – Backend (FastAPI, Clean Architecture, TDD)"
authors = [
    { name = "Ingo Schwarzhaupt", email = "64007208+ingo-code@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
